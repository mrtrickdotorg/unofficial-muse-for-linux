name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install native GTK dependencies
      run: |
        # GitHub's apt mirrorlist currently points at an unreliable Azure node.
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          if ! grep -q 'mirrors.edge.kernel.org' /etc/apt/apt-mirrors.txt; then
            printf 'http://mirrors.edge.kernel.org/ubuntu/\tpriority:1\n' \
              | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
          fi
        fi
        if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
          sudo sed -i -E \
            -e 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://mirrors.edge.kernel.org/ubuntu/#g' \
            -e 's#https?://(archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' \
            /etc/apt/sources.list.d/ubuntu.sources
        fi
        sudo apt-get update
        sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev pkg-config python3 python3-venv xauth xvfb
    - name: Install formatting and lint tools
      run: rustup component add rustfmt clippy
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Install pinned test-only community runtime
      run: ./scripts/setup-account-bridge.sh --prefix "$HOME/.local/share/muse-ci-account-bridge"
    - name: Check scripts and run all offline account/host tests (no skips)
      run: MUSE_ACCOUNT_TEST_PYTHON="$HOME/.local/share/muse-ci-account-bridge/.venv/bin/python" ./scripts/test-account.sh
    - name: Build
      run: cargo build --workspace --locked --verbose
    - name: Run tests
      # Persistence tests reject /tmp because its world-writable ancestors are
      # not trusted, and the local-host tests require TMPDIR to be set at all.
      # Note: TMPDIR cannot move to job-level env, where the runner context is
      # unavailable and the whole workflow is rejected.
      env:
        TMPDIR: ${{ runner.temp }}
      run: cargo test --workspace --locked --verbose
    - name: Run native account GUI smoke test
      env:
        TMPDIR: ${{ runner.temp }}
      run: xvfb-run -a cargo test -p muse --locked -- --ignored --test-threads=1
    - name: Lint
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
