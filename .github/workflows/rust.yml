name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # The commit-message check walks the pushed history, so the default
        # single-commit fetch is not enough.
        fetch-depth: 0
    - name: Check commit messages for attribution
      # Its own step, pinned like the environment mutation guard: a message that
      # carries the Codebuff trailer fails the build even if later steps are
      # narrowed or excluded. AGENTS.md records the rule.
      env:
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
        BASE_REF: ${{ github.base_ref }}
      run: ./scripts/check-commit-messages.sh
    - name: Install native GTK dependencies
      run: |
        # GitHub's apt mirrorlist has pointed at an unreliable Azure node, and
        # kernel.org's mirror has been unreachable for whole afternoons, so
        # neither is trusted on its own: walk them until one answers an update,
        # then install from wherever that left the sources. A runner that
        # reaches neither mirror fails here, not three steps later.
        deploy=/etc/apt/sources.list.d/ubuntu.sources
        ready=0
        for mirror in \
          http://mirrors.edge.kernel.org/ubuntu \
          http://archive.ubuntu.com/ubuntu; do
          sudo cp "$deploy" /tmp/ubuntu.sources.stock
          sudo sed -i -E \
            -e "s#mirror\+file:/etc/apt/apt-mirrors\.txt#${mirror}#g" \
            -e "s#https?://(archive|security)\.ubuntu\.com/ubuntu/?#${mirror}#g" \
            -e "s#http://mirrors\.edge\.kernel\.org/ubuntu#${mirror}#g" \
            "$deploy"
          if sudo apt-get update -o Acquire::Retries=2; then
            ready=1
            break
          fi
          echo "::warning::${mirror} did not answer; trying the next mirror"
          sudo cp /tmp/ubuntu.sources.stock "$deploy"
        done
        if [[ $ready != 1 ]]; then
          echo "no Ubuntu mirror answered" >&2
          exit 1
        fi
        sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev pkg-config python3 python3-venv xauth xvfb \
          python3-gi gir1.2-atspi-2.0 at-spi2-core dbus-x11
    - name: Install formatting and lint tools
      run: rustup component add rustfmt clippy
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Install pinned test-only community runtime
      run: ./scripts/setup-account-bridge.sh --prefix "$HOME/.local/share/muse-ci-account-bridge"
    - name: Check scripts and run all offline account/host tests (no skips)
      run: MUSE_ACCOUNT_TEST_PYTHON="$HOME/.local/share/muse-ci-account-bridge/.venv/bin/python" ./scripts/test-account.sh
    - name: Build
      run: cargo build --workspace --locked --verbose
    - name: Run tests
      # Persistence tests reject /tmp because its world-writable ancestors are
      # not trusted, and the local-host tests require TMPDIR to be set at all.
      # Note: TMPDIR cannot move to job-level env, where the runner context is
      # unavailable and the whole workflow is rejected.
      env:
        TMPDIR: ${{ runner.temp }}
      run: cargo test --workspace --locked --verbose
    - name: Run environment mutation guard
      # Pinned explicitly so the guard keeps failing builds even if the
      # workspace test invocation above is ever narrowed or excluded.
      run: cargo test -p muse --locked --test env_guard
    - name: Run native account GUI smoke test
      env:
        TMPDIR: ${{ runner.temp }}
      run: xvfb-run -a cargo test -p muse --locked -- --ignored --test-threads=1
    - name: Lint
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Run the two-window Settings harness
      # The real app, driven through its accessibility tree: the rounds that
      # only a window can prove -- mid-press words, the check refusal, the
      # staged sentence, both failure paths -- run on every push instead of
      # only when someone has a desktop open. A private session bus carries
      # the accessibility bus, Xvfb the window, and the saved link is seeded
      # so the app opens on a linked copy (the harness only needs the file to
      # exist; 0600 and uid-owned, or the app reads it as absent).
      env:
        XDG_CONFIG_HOME: ${{ runner.temp }}/harness-config
        XDG_RUNTIME_DIR: ${{ runner.temp }}/harness-runtime
      run: |
        set -euo pipefail
        install -d -m 700 "$XDG_RUNTIME_DIR" "$RUNNER_TEMP/muse-session"
        account="$XDG_CONFIG_HOME/unofficial-muse-for-linux/account"
        install -d -m 700 "$account"
        printf '%s' "{\"python\":\"/usr/bin/python3\",\"config_dir\":\"$RUNNER_TEMP/muse-session\",\"consent\":true}" \
          > "$account/account-connection.json"
        chmod 600 "$account/account-connection.json"
        # A loaded runner opens a window slower than a seat does, so the feed
        # answer waits longer and the settle budget is stretched; both are
        # the script's own knobs, not app behaviour.
        dbus-run-session -- xvfb-run -a ./scripts/settings-two-windows.py \
          --delay-ms 4000 --timeout 40
        dbus-run-session -- xvfb-run -a ./scripts/settings-two-windows.py \
          --no-appimage --timeout 40

  window-spike:
    # `apps/muse-window` is excluded from the workspace: it is GTK 3 + WebKitGTK
    # 4.1, and the app must not carry that engine in its lock, build or tests.
    # It is compiled here so the spike in the tree cannot rot.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install the GTK 3 / WebKitGTK 4.1 stack
      run: |
        sudo apt-get update
        sudo apt-get install --yes pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
    - name: Check formatting
      run: |
        rustup component add rustfmt clippy
        cargo fmt --manifest-path apps/muse-window/Cargo.toml -- --check
    - name: Build and lint
      run: |
        cargo build --manifest-path apps/muse-window/Cargo.toml --locked
        cargo clippy --manifest-path apps/muse-window/Cargo.toml --all-targets --locked -- -D warnings
