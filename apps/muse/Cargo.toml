[package]
name = "muse"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Mac-parity Muse client for Linux (GTK4 + Libadwaita rewrite)"
default-run = "muse"

[[bin]]
name = "muse"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"] }
gtk4 = { version = "0.10.3", features = ["v4_8"] }
muse-account = { path = "../../crates/muse-account" }
muse-local-link = { path = "../../crates/muse-local-link" }
muse-local-tools = { path = "../../crates/muse-local-tools" }
muse-tasks = { path = "../../crates/muse-tasks" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already the app's through GTK: its checksum is the SHA-256 the
# updater verifies downloads with, so the check needs no new crate.
glib = "0.21"
libc = "0.2"
# `proxy-from-env` so a seat behind a proxy can reach the release feed at all;
# without it the check ignores the proxy its other traffic uses and hangs.
ureq = { version = "2", default-features = false, features = ["tls", "json", "proxy-from-env"] }
webkit6 = "0.5"
