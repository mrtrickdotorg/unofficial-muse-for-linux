  <style>:root{--ground: #090d1a;--ground-2: #060912;--surface-solid: #111827;--surface-raised: #1a263a;--surface-overlay: #23334b;--card-gradient: linear-gradient(145deg, rgba(24, 34, 52, .97), rgba(15, 22, 36, .94));--hairline: rgba(226, 232, 255, .1);--hairline-light: rgba(226, 232, 255, .22);--accent: #36a3ff;--accent-end: #55e5c1;--accent-gradient: linear-gradient(135deg, var(--accent), var(--accent-end));--accent-tint: rgba(54, 163, 255, .14);--accent-border: rgba(54, 163, 255, .42);--text: #f8fafc;--text-muted: #aebbd0;--text-faint: #74849d;--ok: #42d7a4;--warn: #f59e0b;--radius-card: 20px;--radius-sm: 12px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ground);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}.page{max-width:1120px;margin:0 auto;padding:30px 34px 56px}.top{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}.title{font-size:27px;font-weight:800;letter-spacing:-.4px;margin:0}.count{color:var(--text-faint);font-size:13px}.search{width:100%;margin-bottom:16px;padding:11px 15px;border-radius:var(--radius-sm);border:1px solid var(--hairline);background:#ffffff0a;color:var(--text);font:inherit;font-size:13.5px;outline:none}.search:focus{border-color:var(--accent-border)}.search::placeholder{color:var(--text-faint)}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.tab{padding:8px 15px;border-radius:999px;border:1px solid var(--hairline);background:transparent;color:var(--text-muted);font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;transition:border-color .16s ease,color .16s ease,background .16s ease}.tab:hover{color:var(--text);background:#e2e8ff0e}.tab.active{color:var(--text);border-color:var(--accent-border);background:linear-gradient(to right,#36a3ff33,#55e5c114)}.section{margin:4px 0 10px;color:var(--text-faint);font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repe
